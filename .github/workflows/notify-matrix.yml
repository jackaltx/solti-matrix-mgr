---
name: Notify Matrix (reusable)

on:
  workflow_call:
    inputs:
      status:
        description: "Combined lint job status (e.g. success/success/failure/success)"
        required: true
        type: string
      failed:
        description: "true if any required job failed"
        required: true
        type: boolean
      cancelled:
        description: "true if any required job was cancelled"
        required: false
        type: boolean
        default: false
    secrets:
      MATRIX_HOMESERVER_URL:
        required: true
      MATRIX_CI_TOKEN:
        required: true
      MATRIX_CI_ROOM_ID:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send CI result to Matrix
        env:
          MATRIX_URL: ${{ secrets.MATRIX_HOMESERVER_URL }}
          MATRIX_TOKEN: ${{ secrets.MATRIX_CI_TOKEN }}
          MATRIX_ROOM: ${{ secrets.MATRIX_CI_ROOM_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          if [[ "${{ inputs.failed }}" == "true" ]]; then
            ICON="❌"
          elif [[ "${{ inputs.cancelled }}" == "true" ]]; then
            ICON="⚠️"
          else
            ICON="✅"
          fi
          COMMIT_FIRST=$(echo "${COMMIT_MSG}" | head -1)
          ROOM_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${MATRIX_ROOM}'))")
          TXN_ID="ci-$(date +%s%N)"
          BODY="${ICON} ${{ github.repository }} lint — ${{ inputs.status }} (${{ github.ref_name }} @ ${GITHUB_SHA::7})"
          if [[ -n "${COMMIT_FIRST}" ]]; then
            BODY="${BODY}\n${COMMIT_FIRST}"
          fi
          curl -sf --max-time 15 -X PUT "${MATRIX_URL}/_matrix/client/v3/rooms/${ROOM_ENCODED}/send/m.room.message/${TXN_ID}" \
            -H "Authorization: Bearer ${MATRIX_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"m.text\",\"body\":\"${BODY}\"}" || true
