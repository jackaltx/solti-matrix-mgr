---
- name: Converge — provision using production inventory schema
  hosts: all
  gather_facts: false

  tasks:
    - name: Login as admin (ephemeral token)
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/login"
        method: POST
        body_format: json
        body:
          type: m.login.password
          identifier:
            type: m.id.user
            user: "admin"
          password: "{{ matrix_admin_password }}"
        status_code: 200
      register: _login
      delegate_to: localhost

    - name: Set admin token
      ansible.builtin.set_fact:
        _admin_token: "{{ _login.json.access_token }}"

    - name: Bootstrap human users
      jackaltx.solti_matrix_mgr.matrix_config:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ _admin_token }}"
        domain: "{{ matrix_domain }}"
        default_members: "{{ default_members | default([]) }}"
        users: "{{ matrix_humans }}"
        rooms: []
      register: _bootstrap_result

    - name: Bootstrap summary
      ansible.builtin.debug:
        msg: "Humans: {{ _bootstrap_result.summary }}"

    - name: Provision each room (bots + room + members)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../playbooks/tasks/provision_room.yml"
      loop: "{{ matrix_rooms }}"
      loop_control:
        loop_var: _room
        label: "{{ _room.name }}"
