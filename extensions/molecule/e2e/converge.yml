---
- name: Converge
  hosts: all
  gather_facts: false

  tasks:
    - name: Get admin access token
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/login"
        method: POST
        body_format: json
        body:
          type: m.login.password
          identifier:
            type: m.id.user
            user: "admin"
          password: "{{ matrix_admin_password }}"
        status_code: 200
      register: admin_login
      delegate_to: localhost

    - name: Provision bot user and test room
      jackaltx.solti_matrix_mgr.matrix_config:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ admin_login.json.access_token }}"
        domain: "matrix.test"
        users:
          - user_id: "@bot"
            displayname: "E2E Sender Bot"
            password: "{{ matrix_bot_password }}"
            user_type: bot
        rooms:
          - alias: "{{ matrix_room_alias }}"
            name: "E2E Integration Room"
            members:
              - user_id: "@admin"
                power_level: 100
              - user_id: "@bot"
                power_level: 50
      register: config_result

    - name: Post E2E test event
      jackaltx.solti_matrix_mgr.matrix_event:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ config_result.tokens['@bot:matrix.test'] }}"
        room_id: "#{{ matrix_room_alias }}:matrix.test"
        content:
          msgtype: "com.solti.event"
          body: "Hello from GitHub E2E Phase 1"
          solti:
            schema: "test.v1"
            source: "molecule/e2e"
            timestamp: "{{ now(fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            data:
              message: "Phase 1 Complete"
      register: event_post

    - name: Store event_id for Phase 2
      ansible.builtin.copy:
        content: "{{ event_post.event_id }}"
        dest: "{{ molecule_ephemeral_directory }}/synapse_test_event_id.txt"
      delegate_to: localhost
