---
- name: Verify (Phase 2)
  hosts: all
  gather_facts: false

  vars:
    receiver_user: "@receiver:matrix.test"
    receiver_password: "receiver_password"

  tasks:
    - name: Get admin access token
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/login"
        method: POST
        body_format: json
        body:
          type: m.login.password
          identifier:
            type: m.id.user
            user: "admin"
          password: "{{ matrix_admin_password }}"
        status_code: 200
      register: admin_login
      delegate_to: localhost

    - name: Create receiver bot (via Admin)
      jackaltx.solti_matrix_mgr.synapse_user:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ admin_login.json.access_token }}"
        user_id: "{{ receiver_user }}"
        password: "{{ receiver_password }}"
        displayname: "E2E Receiver Bot"
        user_type: bot
        state: present
      register: receiver_creation

    - name: Resolve room alias to room ID
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/directory/room/%23{{ matrix_room_alias }}%3Amatrix.test"
        method: GET
        headers:
          Authorization: "Bearer {{ admin_login.json.access_token }}"
        status_code: 200
      register: room_lookup
      delegate_to: localhost

    - name: Admin invites receiver bot to room
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/rooms/{{ room_lookup.json.room_id }}/invite"
        method: POST
        body_format: json
        body:
          user_id: "{{ receiver_user }}"
        headers:
          Authorization: "Bearer {{ admin_login.json.access_token }}"
        status_code: [200, 403]
      delegate_to: localhost

    - name: Receiver bot accepts invite and joins room
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/join/{{ room_lookup.json.room_id }}"
        method: POST
        body_format: json
        body: {}
        headers:
          Authorization: "Bearer {{ receiver_creation.access_token }}"
        status_code: 200
      delegate_to: localhost

    - name: Read expected event ID
      ansible.builtin.slurp:
        src: "{{ molecule_ephemeral_directory }}/synapse_test_event_id.txt"
      register: expected_event_id_raw
      delegate_to: localhost

    - name: Set expected event ID fact
      ansible.builtin.set_fact:
        expected_event_id: "{{ expected_event_id_raw.content | b64decode }}"

    - name: Debug event ID (for CI logs only)
      ansible.builtin.debug:
        msg: "E2E Test Event ID: {{ expected_event_id }}"
      when: lookup('env', 'CI') | length > 0

    - name: Receiver bot posts reply to sender's event
      jackaltx.solti_matrix_mgr.matrix_event:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ receiver_creation.access_token }}"
        room_id: "{{ room_lookup.json.room_id }}"
        content:
          msgtype: "m.text"
          body: "Acknowledged: Event {{ expected_event_id }} received and validated by receiver bot"
      register: reply_post

    - name: Debug reply event ID
      ansible.builtin.debug:
        msg: "Reply Event ID: {{ reply_post.event_id }}"
      when: lookup('env', 'CI') | length > 0

    - name: Get room info via Synapse admin API
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_synapse/admin/v1/rooms/{{ room_lookup.json.room_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ admin_login.json.access_token }}"
        status_code: 200
      register: final_room_info
      delegate_to: localhost

    - name: Assert room exists with correct alias
      ansible.builtin.assert:
        that:
          - final_room_info.json.room_id.startswith('!')
          - matrix_room_alias in (final_room_info.json.canonical_alias | default(''))
        msg: "E2E Verification Failed: Room info mismatch"

    # =========================================================
    # Validate Bot User Types
    # =========================================================

    - name: Query all bot users
      jackaltx.solti_matrix_mgr.synapse_user_info:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ admin_login.json.access_token }}"
        user_type: bot
      register: bot_users

    - name: Debug bot users found
      ansible.builtin.debug:
        msg:
          - "Bot users found: {{ bot_users.total }}"
          - "Bot user IDs: {{ bot_users.users | map(attribute='name') | list }}"
      when: lookup('env', 'CI') | length > 0

    - name: Assert both bots have user_type bot
      ansible.builtin.assert:
        that:
          - bot_users.total >= 2
          - bot_users.users | selectattr('name', 'equalto', matrix_bot_user) | list | length == 1
          - bot_users.users | selectattr('name', 'equalto', receiver_user) | list | length == 1
          - bot_users.users | selectattr('name', 'equalto', matrix_bot_user) | map(attribute='user_type') | first == 'bot'
          - bot_users.users | selectattr('name', 'equalto', receiver_user) | map(attribute='user_type') | first == 'bot'
        msg: "E2E Verification Failed: Bot user_type validation failed"
        success_msg: "✓ Both sender and receiver bots have user_type: bot"

    # =========================================================
    # Test Tear-Down (Deletion)
    # =========================================================

    - name: Delete receiver bot
      jackaltx.solti_matrix_mgr.synapse_user:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ admin_login.json.access_token }}"
        user_id: "{{ receiver_user }}"
        state: absent
      register: receiver_delete

    - name: Verify receiver bot was deactivated
      jackaltx.solti_matrix_mgr.synapse_user_info:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ admin_login.json.access_token }}"
        user_id: "{{ receiver_user }}"
      register: receiver_check

    - name: Assert receiver bot is deactivated
      ansible.builtin.assert:
        that:
          - receiver_check.total == 1
          - receiver_check.users[0].deactivated == true
        msg: "Receiver bot should be deactivated"
        success_msg: "✓ Receiver bot deactivated successfully"

    - name: Delete receiver bot again (idempotency test)
      jackaltx.solti_matrix_mgr.synapse_user:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ admin_login.json.access_token }}"
        user_id: "{{ receiver_user }}"
        state: absent
      register: receiver_delete_again

    - name: Assert deletion is idempotent
      ansible.builtin.assert:
        that:
          - not receiver_delete_again.changed
        msg: "Deleting already-deactivated user should be idempotent"
        success_msg: "✓ User deletion is idempotent"

    - name: Delete sender bot
      jackaltx.solti_matrix_mgr.synapse_user:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ admin_login.json.access_token }}"
        user_id: "{{ matrix_bot_user }}"
        state: absent
      register: sender_delete

    - name: Query bot users after deletion
      jackaltx.solti_matrix_mgr.synapse_user_info:
        homeserver_url: "{{ matrix_homeserver_url }}"
        access_token: "{{ admin_login.json.access_token }}"
        user_type: bot
        deactivated: false
      register: active_bots_after_delete

    - name: Assert no active bot users remain
      ansible.builtin.assert:
        that:
          - active_bots_after_delete.total == 0
        msg: "All bot users should be deactivated"
        success_msg: "✓ All bot users deactivated successfully"
