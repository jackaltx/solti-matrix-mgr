---
- name: Verify — provisioning results
  hosts: all
  gather_facts: true

  tasks:
    - name: Login as admin
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/login"
        method: POST
        body_format: json
        body:
          type: m.login.password
          identifier:
            type: m.id.user
            user: "admin"
          password: "{{ matrix_admin_password }}"
        status_code: 200
      register: _login
      delegate_to: localhost

    - name: Set admin token
      ansible.builtin.set_fact:
        _admin_token: "{{ _login.json.access_token }}"

    - name: "Level 0 — rooms exist"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../playbooks/tasks/verify_0_rooms.yml"

    - name: "Level 1 — members joined with correct power levels"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../playbooks/tasks/verify_1_members.yml"

    - name: "Level 2 — access control enforcement"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../playbooks/tasks/verify_2_access.yml"
