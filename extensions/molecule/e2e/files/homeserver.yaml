---
server_name: "matrix.test"
report_stats: false
database:
  name: sqlite3
  args:
    database: "/data/homeserver.db"
log_config: "/data/matrix.test.log.config"
media_store_path: "/data/media_store"
registration_shared_secret: "molecule_test_secret"
enable_registration: true
# Allow admin API
enable_registration_without_verification: true
# Disable rate limiting for tests
rc_login:
  address:
    per_second: 1000
    burst_count: 1000
  account:
    per_second: 1000
    burst_count: 1000
  failed_attempts:
    per_second: 1000
    burst_count: 1000
rc_message:
  per_second: 1000
  burst_count: 1000
rc_admin_redaction:
  per_second: 1000
  burst_count: 1000
# Standard ports
listeners:
  - port: 8008
    tls: false
    type: http
    resources:
      - names: [client, federation]
        compress: false
