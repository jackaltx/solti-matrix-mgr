---
# Audit Matrix user devices (access tokens) for admin + all bots.
#
# Prereq: source ~/.secrets/LabProvision (sets VAULT_ADDR + VAULT_TOKEN)
#
# Usage:
#   ./matrix-manage.sh -i inventory/hosts audit tokens
#   ./matrix-manage.sh -i inventory/hosts audit tokens -e cleanup_old=true
#   ./matrix-manage.sh -i inventory/hosts audit tokens -e max_age_days=30

- name: Audit Matrix Tokens
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    cleanup_old: false
    max_age_days: 30
    _vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
    _vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    _vault_creds: "{{ lookup('community.hashi_vault.hashi_vault',
      'kv/data/infrastructure/' + matrix_homeserver + '/synapse',
      auth_method='token',
      token=_vault_token,
      url=_vault_addr) }}"

  pre_tasks:
    - name: Verify Vault env vars set
      ansible.builtin.assert:
        that:
          - _vault_token != ''
          - _vault_addr != ''
        fail_msg: "VAULT_TOKEN or VAULT_ADDR not set — run: source ~/.secrets/LabProvision"

    - name: Login to Matrix as admin (ephemeral token)
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/login"
        method: POST
        body_format: json
        body:
          type: "m.login.password"
          identifier:
            type: "m.id.user"
            user: "admin"
          password: "{{ _vault_creds.admin_password }}"
        status_code: 200
      register: _login
      no_log: true

    - name: Set admin token
      ansible.builtin.set_fact:
        _admin_token: "{{ _login.json.access_token }}"
      no_log: true

  tasks:
    - name: Audit devices for admin + all bots
      ansible.builtin.include_tasks: audit_user_devices.yml
      vars:
        _audit_user: "{{ item }}"
      loop: >-
        {{
          ['@admin:' + matrix_domain]
          + (matrix_bots | map(attribute='user_id') | map('regex_replace', '$', ':' + matrix_domain) | list)
        }}

  post_tasks:
    - name: Logout (revoke ephemeral token)
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/logout"
        method: POST
        headers:
          Authorization: "Bearer {{ _admin_token }}"
        status_code: 200
      no_log: true
      ignore_errors: true
