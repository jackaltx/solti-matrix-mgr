---
# List all rooms on the Matrix homeserver via Synapse Admin API
#
# Fetches admin credentials from HashiVault — no wrapper script needed.
# Prereq: source ~/.secrets/LabProvision (sets VAULT_ADDR + VAULT_TOKEN)
#
# Usage:
#   source ~/.secrets/LabProvision
#   ansible-playbook playbooks/admin/list-rooms.yml
#   ansible-playbook playbooks/admin/list-rooms.yml -e room_limit_override=50
#
# Vault path: kv/data/infrastructure/matrix-web/synapse (admin_password field)
# Homeserver and admin user come from vars below — override via extra-vars or
# private inventory/hosts/ group_vars when that repo exists.

- name: List Matrix Rooms
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    matrix_vault_host: "matrix-web"
    matrix_homeserver_url: "https://matrix-web.jackaltx.com"
    matrix_admin_user: "@admin:jackaltx.com"
    room_limit: "{{ room_limit_override | default(100) }}"

    _vault_creds: "{{ lookup('community.hashi_vault.hashi_vault',
      'kv/data/infrastructure/' + matrix_vault_host + '/synapse',
      auth_method='token',
      token=lookup('env', 'VAULT_TOKEN'),
      url=lookup('env', 'VAULT_ADDR')) }}"

  pre_tasks:
    - name: Verify Vault env vars set
      ansible.builtin.assert:
        that:
          - lookup('env', 'VAULT_TOKEN') != ''
          - lookup('env', 'VAULT_ADDR') != ''
        fail_msg: "VAULT_TOKEN or VAULT_ADDR not set — run: source ~/.secrets/LabProvision"

    - name: Login to Matrix as admin (get ephemeral token)
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/login"
        method: POST
        body_format: json
        body:
          type: "m.login.password"
          user: "{{ matrix_admin_user }}"
          password: "{{ _vault_creds.admin_password }}"
        status_code: 200
      register: _login
      no_log: true

    - name: Set admin token fact
      ansible.builtin.set_fact:
        matrix_admin_token: "{{ _login.json.access_token }}"
      no_log: true

  tasks:

    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "Homeserver: {{ matrix_homeserver_url }}"
          - "Admin user: {{ matrix_admin_user }}"
          - "Room limit: {{ room_limit }}"

    - name: Query Synapse Admin API for rooms
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_synapse/admin/v1/rooms?limit={{ room_limit }}"
        method: GET
        headers:
          Authorization: "Bearer {{ matrix_admin_token }}"
        return_content: true
        status_code: 200
      register: rooms_response
      no_log: true

    - name: Display rooms
      ansible.builtin.debug:
        var: rooms_result
      vars:
        rooms_result: "{{ rooms_response.json.rooms | map('combine', {}) | map('dict2items') | map('selectattr', 'key', 'in', display_fields) | map('items2dict') | list }}"
        display_fields:
          - room_id
          - name
          - canonical_alias
          - creator
          - joined_members
          - join_rules

    - name: Summary
      ansible.builtin.debug:
        msg: "Total rooms: {{ rooms_response.json.total_rooms }}"

  post_tasks:
    - name: Logout (revoke ephemeral token)
      ansible.builtin.uri:
        url: "{{ matrix_homeserver_url }}/_matrix/client/v3/logout"
        method: POST
        headers:
          Authorization: "Bearer {{ matrix_admin_token }}"
        status_code: 200
      no_log: true
      ignore_errors: true
