---
# Provision a single room: create bot users + room + members.
# Called with loop_var: _room  (one entry from matrix_rooms)
# Requires: _admin_token, matrix_homeserver_url, matrix_domain, matrix_bots
#           _vault_addr, _vault_token

- name: "{{ _room.name }} - find bot definitions"
  ansible.builtin.set_fact:
    _room_bot_defs: >-
      {{
        matrix_bots
        | selectattr('user_id', 'in',
            _room.members
            | selectattr('type', 'equalto', 'bot')
            | map(attribute='user_id')
            | list)
        | list
      }}

- name: "{{ _room.name }} - resolve bot passwords from Vault"
  ansible.builtin.set_fact:
    _room_users: "{{ _room_users | default([]) + [_bot_entry] }}"
  vars:
    _bot_entry:
      user_id: "{{ item.user_id }}"
      displayname: "{{ item.displayname }}"
      password: >-
        {{ lookup('community.hashi_vault.hashi_vault',
           'kv/data/' + item.vault_path,
           auth_method='token',
           token=_vault_token,
           url=_vault_addr).password }}
  loop: "{{ _room_bot_defs }}"
  loop_control:
    label: "{{ item.user_id }}"
  no_log: true

- name: "{{ _room.name }} - build room config object"
  ansible.builtin.set_fact:
    _this_room_config:
      alias: "{{ _room.alias }}"
      name: "{{ _room.display_name }}"
      topic: "{{ _room.topic | default('') }}"
      retention: "{{ _room.retention | default({}) }}"
      members: "{{ _room.members }}"

- name: "{{ _room.name }} - provision via matrix_config"
  jackaltx.solti_matrix_mgr.matrix_config:
    homeserver_url: "{{ matrix_homeserver_url }}"
    access_token: "{{ _admin_token }}"
    domain: "{{ matrix_domain }}"
    users: "{{ _room_users | default([]) }}"
    rooms: "{{ [_this_room_config] }}"
  register: _room_result
  no_log: "{{ matrix_no_log | default(true) }}"

- name: "{{ _room.name }} - resolve room ID"
  ansible.builtin.uri:
    url: "{{ matrix_homeserver_url }}/_matrix/client/v3/directory/room/%23{{ _room.alias }}%3A{{ matrix_domain }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _admin_token }}"
    status_code: 200
  register: _room_alias_result
  no_log: true

- name: "{{ _room.name }} - force-join all members via Synapse Admin API"
  ansible.builtin.uri:
    url: "{{ matrix_homeserver_url }}/_synapse/admin/v1/join/{{ _room_alias_result.json.room_id }}"
    method: POST
    headers:
      Authorization: "Bearer {{ _admin_token }}"
    body_format: json
    body:
      user_id: "{{ item.user_id }}:{{ matrix_domain }}"
    status_code: 200
  loop: "{{ _room.members }}"
  loop_control:
    label: "{{ item.user_id }}"
  register: _join_results

- name: "{{ _room.name }} - results"
  ansible.builtin.debug:
    msg:
      - "Room:    {{ _room.name }} (#{{ _room.alias }}:{{ matrix_domain }})"
      - "Changed: {{ _room_result.changed }}"
      - "Summary: {{ _room_result.summary | default('') }}"
      - "Joined:  {{ _join_results.results | length }} members force-joined"

- name: "{{ _room.name }} - reset accumulator"
  ansible.builtin.set_fact:
    _room_users: []
